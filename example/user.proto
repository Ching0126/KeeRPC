syntax = "proto3";

package Kuser;//命名空间

option cc_generic_services = true;//把service也变成类

message ResultCode{
    int32 errcode = 1;//参数类型，姓名，编号
    bytes errmsg = 2;
}

message LoginRequest{
    bytes name = 1;
    bytes pwd = 2;
}

message LoginResponse{
    ResultCode result = 1;
    bool success = 2;
}

message RegisterRequest{
    uint32 id = 1;
    bytes name = 2;
    bytes pwd = 3;
}

message RegisterResponse{
    ResultCode result = 1;
    bool sucess = 2;
}
//自动生成两个类，一个类同名 第二个类原名_Stub
service UserServiceRpc{//声明一个远程服务，本质也是一个类，这里是两个可以被远程调用的方法
    rpc Login(LoginRequest) returns(LoginResponse);
    rpc Register(RegisterRequest) returns(RegisterResponse);
}